name: NPM Publish Canary

on:
   push:
      branches: [canary]
      paths-ignore:
         - sites/www/**

permissions:
   contents: read
   id-token: write

concurrency:
   group: publish-canary
   cancel-in-progress: false

jobs:
   publish:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v6
         - uses: voidzero-dev/setup-vp@v1.21.1
           with:
              node-version: 24
              registry-url: https://registry.npmjs.org
              run-install: false
              cache: false
         - run: vp install --frozen-lockfile --filter '!@codeworksh/www'
         # Package tsconfigs resolve aikit through its generated declarations.
         - run: vp run @codeworksh/aikit#build
         - run: vp check packages scripts .github
         - run: vp run --filter './packages/*' --concurrency-limit 2 typecheck
         - name: Publish all packages under canary
           run: node scripts/canary.mjs
