name: Publish canary

on:
   push:
      branches: [canary]

permissions:
   contents: read
   id-token: write

concurrency:
   group: publish-canary
   cancel-in-progress: false

jobs:
   publish:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v6
         - uses: voidzero-dev/setup-vp@v1.21.1
           with:
              node-version: 24
              registry-url: https://registry.npmjs.org
              run-install: false
              cache: false
         - run: vp install --frozen-lockfile
         # Package tsconfigs resolve aikit through its generated declarations.
         - run: vp run @codeworksh/aikit#build
         - run: vp exec astro sync
           working-directory: sites/www
         - run: vp check
         - run: vp run typecheck
         - name: Publish all packages under canary
           run: node scripts/canary.mjs
