packages:
   - packages/*

allowBuilds:
   "@mongodb-js/zstd": true
   esbuild: true
   lmdb: true
   msgpackr-extract: true
   msw: true
   node-liblzma: true
   protobufjs: true

onlyBuiltDependencies:
   - "@mongodb-js/zstd"
   - esbuild
   - lmdb
   - msgpackr-extract
   - msw
   - node-liblzma

storeDir: .pnpm-store

minimumReleaseAgeExclude:
   - "@vercel/rust@1.4.0"
   - vercel@54.18.7
   - "@effect/tsgo-darwin-arm64@0.31.0"
   - "@effect/tsgo-darwin-x64@0.31.0"
   - "@effect/tsgo-linux-arm64@0.31.0"
   - "@effect/tsgo-linux-arm@0.31.0"
   - "@effect/tsgo-linux-x64@0.31.0"
   - "@effect/tsgo-win32-arm64@0.31.0"
   - "@effect/tsgo-win32-x64@0.31.0"
   - "@effect/tsgo@0.31.0"
