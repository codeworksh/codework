packages:
   - apps/*
   - packages/*
   - extras/*
   - sites/*

# Effect TS-Go only ships patch artifacts for specific TypeScript versions.
# Keep these versions aligned and bump them together.
catalog:
   "@effect/tsgo": 0.45.0
   "@types/node": ^26.5.1
   typescript: 7.0.2
   # `vite` resolves to the Vite+ core so plugins (e.g. @vitejs/plugin-react)
   # build against the same toolchain that `vp` runs.
   vite: npm:@voidzero-dev/vite-plus-core@0.3.1
   vite-plus: 0.3.1

allowBuilds:
   "@mongodb-js/zstd": true
   # Downloads the Electron binary on install.
   electron: true
   # vgpu's Node adapter; the site renders in the browser only.
   "@vgpu/adapter-node": false
   esbuild: true
   msw: true
   node-liblzma: true
   protobufjs: true
   webgpu: false

storeDir: .pnpm-store
