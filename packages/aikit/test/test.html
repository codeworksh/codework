<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>aikit — test themes</title>
		<style>
			:root {
				--bg: #fbfbfa;
				--panel: #ffffff;
				--panel-2: #f5f5f3;
				--border: #e3e2de;
				--text: #1c1b19;
				--muted: #6f6d68;
				--faint: #97948d;
				--accent: #b8532a;
				--accent-soft: #fbeee7;
				--unit: #2f6f4e;
				--unit-soft: #e6f2eb;
				--e2e: #7a4bab;
				--e2e-soft: #f0e9f8;
				--support: #2a5d8f;
				--support-soft: #e7eff7;
				--warn: #9a6a10;
				--warn-soft: #fcf2dd;
				--mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
				--sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #171716;
					--panel: #1e1e1c;
					--panel-2: #262624;
					--border: #34342f;
					--text: #eceae4;
					--muted: #9d9a92;
					--faint: #78756e;
					--accent: #e2825a;
					--accent-soft: #2e211a;
					--unit: #6fbf90;
					--unit-soft: #1c2b22;
					--e2e: #b48ee0;
					--e2e-soft: #251d30;
					--support: #79aada;
					--support-soft: #18242e;
					--warn: #d7a545;
					--warn-soft: #2c2416;
				}
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				padding: 0;
			}
			body {
				background: var(--bg);
				color: var(--text);
				font-family: var(--sans);
				font-size: 15px;
				line-height: 1.55;
				-webkit-font-smoothing: antialiased;
			}
			code,
			.mono {
				font-family: var(--mono);
				font-size: 0.86em;
			}

			/* ---------- layout ---------- */
			.shell {
				display: grid;
				grid-template-columns: 320px minmax(0, 1fr);
				min-height: 100vh;
			}
			.side {
				border-right: 1px solid var(--border);
				background: var(--panel-2);
				position: sticky;
				top: 0;
				height: 100vh;
				overflow-y: auto;
				padding: 20px 16px 40px;
			}
			.main {
				padding: 32px 40px 96px;
				max-width: 980px;
			}
			@media (max-width: 900px) {
				.shell {
					grid-template-columns: 1fr;
				}
				.side {
					position: static;
					height: auto;
					border-right: 0;
					border-bottom: 1px solid var(--border);
				}
				.main {
					padding: 24px 20px 64px;
				}
			}

			/* ---------- sidebar ---------- */
			.brand {
				font-size: 13px;
				font-weight: 650;
				letter-spacing: 0.04em;
				text-transform: uppercase;
				color: var(--muted);
			}
			.brand strong {
				color: var(--text);
			}
			.meta {
				font-size: 12px;
				color: var(--faint);
				margin-top: 4px;
				font-family: var(--mono);
			}
			.progress-wrap {
				margin: 18px 0 14px;
			}
			.progress-label {
				display: flex;
				justify-content: space-between;
				font-size: 12px;
				color: var(--muted);
				margin-bottom: 6px;
			}
			.progress {
				height: 5px;
				background: var(--border);
				border-radius: 99px;
				overflow: hidden;
			}
			.progress > span {
				display: block;
				height: 100%;
				background: var(--accent);
				border-radius: 99px;
				transition: width 0.25s ease;
			}
			.search {
				width: 100%;
				padding: 7px 10px;
				border: 1px solid var(--border);
				border-radius: 7px;
				background: var(--panel);
				color: var(--text);
				font-family: var(--sans);
				font-size: 13px;
				margin-bottom: 14px;
			}
			.search:focus {
				outline: 2px solid var(--accent);
				outline-offset: -1px;
			}
			.group-title {
				font-size: 11px;
				letter-spacing: 0.08em;
				text-transform: uppercase;
				color: var(--faint);
				margin: 16px 0 7px;
				font-weight: 650;
			}
			.nav-item {
				display: block;
				width: 100%;
				text-align: left;
				border: 1px solid transparent;
				background: transparent;
				color: var(--text);
				padding: 8px 10px;
				border-radius: 7px;
				cursor: pointer;
				font-family: inherit;
				font-size: 13.5px;
				line-height: 1.35;
				margin-bottom: 2px;
			}
			.nav-item:hover {
				background: var(--panel);
			}
			.nav-item.active {
				background: var(--panel);
				border-color: var(--border);
				box-shadow: inset 2px 0 0 var(--accent);
			}
			.nav-item.done .nav-name {
				color: var(--muted);
				text-decoration: line-through;
				text-decoration-color: var(--faint);
			}
			.nav-row {
				display: flex;
				align-items: baseline;
				gap: 7px;
			}
			.nav-name {
				font-weight: 520;
			}
			.nav-sub {
				font-size: 11.5px;
				color: var(--faint);
				font-family: var(--mono);
				margin-top: 2px;
			}

			/* ---------- badges ---------- */
			.badge {
				display: inline-block;
				font-size: 10.5px;
				font-weight: 650;
				letter-spacing: 0.04em;
				text-transform: uppercase;
				padding: 1px 6px;
				border-radius: 4px;
				vertical-align: middle;
				white-space: nowrap;
			}
			.badge.unit {
				background: var(--unit-soft);
				color: var(--unit);
			}
			.badge.e2e {
				background: var(--e2e-soft);
				color: var(--e2e);
			}
			.badge.support {
				background: var(--support-soft);
				color: var(--support);
			}
			.badge.gap {
				background: var(--warn-soft);
				color: var(--warn);
			}

			/* ---------- main ---------- */
			h1 {
				font-size: 26px;
				margin: 0 0 6px;
				letter-spacing: -0.01em;
			}
			h2 {
				font-size: 14px;
				text-transform: uppercase;
				letter-spacing: 0.07em;
				color: var(--muted);
				margin: 34px 0 12px;
				font-weight: 650;
			}
			h3 {
				font-size: 15px;
				margin: 0 0 4px;
			}
			p {
				margin: 0 0 12px;
			}
			.lede {
				color: var(--muted);
				font-size: 15px;
				margin-bottom: 4px;
			}
			.headline {
				display: flex;
				align-items: flex-start;
				justify-content: space-between;
				gap: 20px;
				flex-wrap: wrap;
			}
			.actions {
				display: flex;
				gap: 8px;
				align-items: center;
				flex-shrink: 0;
			}
			button.btn {
				font-family: inherit;
				font-size: 13px;
				padding: 6px 12px;
				border-radius: 7px;
				cursor: pointer;
				border: 1px solid var(--border);
				background: var(--panel);
				color: var(--text);
			}
			button.btn:hover {
				border-color: var(--accent);
				color: var(--accent);
			}
			button.btn.primary {
				background: var(--accent);
				border-color: var(--accent);
				color: #fff;
			}
			button.btn.primary:hover {
				opacity: 0.9;
				color: #fff;
			}
			.chk {
				display: inline-flex;
				align-items: center;
				gap: 6px;
				font-size: 13px;
				color: var(--muted);
				cursor: pointer;
				user-select: none;
			}

			.card {
				border: 1px solid var(--border);
				background: var(--panel);
				border-radius: 10px;
				padding: 16px 18px;
				margin-bottom: 10px;
			}
			.card-head {
				display: flex;
				align-items: baseline;
				gap: 10px;
				flex-wrap: wrap;
				margin-bottom: 8px;
			}
			.path {
				font-family: var(--mono);
				font-size: 12.5px;
				color: var(--accent);
				word-break: break-all;
			}
			.stats {
				font-family: var(--mono);
				font-size: 11.5px;
				color: var(--faint);
				margin-left: auto;
				white-space: nowrap;
			}
			.covers {
				font-size: 14px;
				margin: 0 0 10px;
			}
			.notes {
				margin: 0;
				padding-left: 18px;
				font-size: 13.5px;
				color: var(--muted);
			}
			.notes li {
				margin-bottom: 4px;
			}
			.notes li::marker {
				color: var(--faint);
			}

			ul.plain {
				margin: 0 0 12px;
				padding-left: 18px;
			}
			ul.plain li {
				margin-bottom: 6px;
			}
			.srclist {
				display: flex;
				flex-wrap: wrap;
				gap: 6px;
			}
			.srclist span {
				font-family: var(--mono);
				font-size: 12px;
				background: var(--panel-2);
				border: 1px solid var(--border);
				padding: 2px 7px;
				border-radius: 5px;
				color: var(--muted);
			}

			table {
				border-collapse: collapse;
				width: 100%;
				font-size: 13px;
			}
			th,
			td {
				text-align: left;
				padding: 7px 10px;
				border-bottom: 1px solid var(--border);
			}
			th {
				font-size: 11px;
				text-transform: uppercase;
				letter-spacing: 0.06em;
				color: var(--faint);
				font-weight: 650;
			}
			td.mono {
				font-family: var(--mono);
				font-size: 12px;
			}
			.yes {
				color: var(--unit);
				font-weight: 650;
			}
			.no {
				color: var(--warn);
				font-weight: 650;
			}
			.scroll {
				overflow-x: auto;
			}

			.callout {
				border-left: 3px solid var(--accent);
				background: var(--accent-soft);
				padding: 12px 16px;
				border-radius: 0 8px 8px 0;
				margin-bottom: 14px;
				font-size: 14px;
			}
			.callout.warn {
				border-left-color: var(--warn);
				background: var(--warn-soft);
			}
			.callout p:last-child {
				margin-bottom: 0;
			}
			.toast {
				position: fixed;
				bottom: 22px;
				left: 50%;
				transform: translateX(-50%) translateY(12px);
				background: var(--text);
				color: var(--bg);
				padding: 8px 16px;
				border-radius: 8px;
				font-size: 13px;
				opacity: 0;
				pointer-events: none;
				transition: all 0.18s ease;
			}
			.toast.show {
				opacity: 1;
				transform: translateX(-50%) translateY(0);
			}
			.cmd {
				font-family: var(--mono);
				font-size: 12.5px;
				background: var(--panel-2);
				border: 1px solid var(--border);
				padding: 8px 12px;
				border-radius: 7px;
				display: block;
				margin-bottom: 8px;
			}
		</style>
	</head>
	<body>
		<div class="shell">
			<nav class="side">
				<div class="brand"><strong>aikit</strong> · test themes</div>
				<div class="meta" id="meta"></div>

				<div class="progress-wrap">
					<div class="progress-label"><span>reviewed</span><span id="progress-count"></span></div>
					<div class="progress"><span id="progress-bar" style="width: 0%"></span></div>
				</div>

				<input class="search" id="search" type="search" placeholder="filter themes / files…" />
				<div id="nav"></div>
			</nav>
			<main class="main" id="main"></main>
		</div>
		<div class="toast" id="toast"></div>

		<script>
			const REPO = "packages/aikit";
			const SNAPSHOT = { date: "2026-08-28", commit: "f920d9706", branch: "sdk" };

			const THEMES = [
				{
					id: "transform",
					name: "Wire transform & message normalization",
					layer: "unit",
					goal: "The bidirectional bridge between aikit's internal Message model and the AI SDK wire format — plus the cross-model handoff rules that make a transcript replayable on a different model.",
					src: ["src/llm/transform.ts (375)", "src/message/message.ts (391)"],
					files: [
						{
							path: "test/transform.test.ts",
							lines: 585,
							tests: 31,
							kind: "unit",
							covers:
								"mapFinishReason (table-driven), mapUsage (cached-token subtraction, totals, per-million cost, request multipliers), convertTools (Codex grammar tools, strict JSON schema, fallbacks), convertMessages (user/assistant/tool conversion, reasoning-metadata replay, tool-call ↔ result pairing, image results, surrogate sanitizing).",
							notes: [
								"Second-largest file in the suite. Four unrelated functions share one file because they share one source module — consider splitting convertMessages into its own file if it keeps growing.",
								"5 of the 21 convertMessages cases are Codex replay-metadata specific (message ids, namespaces, deferred tools, encrypted reasoning). Decide whether they belong here or with the Codex provider theme.",
								"mapUsage asserts cost arithmetic against a hand-built model — check it also exercises the tiered pricing path that model.test.ts covers separately.",
							],
						},
						{
							path: "test/message.transform.test.ts",
							lines: 180,
							tests: 14,
							kind: "unit",
							covers:
								"Message.transformMessages — same-model vs cross-model handoff: keeping/downgrading thinking parts, stripping Google thoughtSignature, synthesizing skipped results for pending/running tool calls, tool-call ID rewriting via callback, input immutability.",
							notes: [
								"Tightly focused and well organized; the strongest file in this theme.",
								"Filename collides conceptually with transform.test.ts — a reader can't tell which is which. Renaming one (e.g. handoff.test.ts) would pay for itself.",
								"Covers the callback-based ID rewrite but not what happens when the callback returns a duplicate/colliding ID.",
							],
						},
					],
					improve: [
						"Resolve the transform.test.ts / message.transform.test.ts naming ambiguity.",
						"Audit convertMessages coverage against every branch in src/llm/transform.ts — this is the module most likely to silently drop content.",
						"Consider moving the Codex-specific replay cases next to the Codex provider tests so provider knowledge lives in one place.",
					],
				},
				{
					id: "model",
					name: "Model catalog, pricing & capabilities",
					layer: "unit",
					goal: "Model metadata as a decision surface: cost math, modality normalization, protocol support, thinking-level clamping, and the generated catalog that feeds it all.",
					src: [
						"src/model/model.ts (323)",
						"src/cli/modelgen.ts",
						"src/llm/shared.ts",
						"src/model/catalog.ts (106) — untested",
					],
					files: [
						{
							path: "test/model.test.ts",
							lines: 162,
							tests: 22,
							kind: "unit",
							covers:
								"calculateCost (per-component, free models, tiered request-wide input pricing), normalizeInput (modality defaults/dedupe/unknown), supportsProtocol, modelsAreEqual, getSupportedThinkingLevels, clampThinkingLevel (down to high, up for disabled levels, off for non-reasoning).",
							notes: [
								"Best-structured unit file in the repo — one describe per exported function, tight assertions.",
								"clampThinkingLevel has the subtlest logic (prefer higher, then fall back lower); worth adding a case where the requested level sits between two disabled levels.",
								"No case pins cost precision (floating-point drift on large token counts).",
							],
						},
						{
							path: "test/modelgen.test.ts",
							lines: 79,
							tests: 5,
							kind: "unit",
							covers:
								"openAICodexBuiltInModels — the public modelgen entry, the explicit Codex model list, GPT-5.6 Codex metadata + reasoning levels, deferred-tool capability flags, pricing tiers.",
							notes: [
								"These are snapshot-shaped assertions against a hardcoded model list; they will need editing every time a Codex model ships. Consider whether that churn is worth it, or whether shape-only assertions would do.",
								"Only the Codex generator is tested — generateModels for other providers is exercised only through the import.",
								"Sits between this theme and the Codex provider theme; review it in whichever session you do second.",
							],
						},
						{
							path: "test/shared.test.ts",
							lines: 39,
							tests: 6,
							kind: "unit",
							covers:
								"applyDefaultMaxTokens — honoring caller values, defaulting from model maxTokens, capping when maxTokens spans the whole context window, leaving undefined when unspecified, preserving unrelated options.",
							notes: [
								"Small and complete for the one function it covers; src/llm/shared.ts may have grown other exports since — check for untested siblings.",
								"Filename says nothing about what it tests. maxtokens.test.ts would read better.",
							],
						},
					],
					improve: [
						"src/model/catalog.ts (106 lines) has no direct test — check whether catalog loading/merging deserves one.",
						"Decide the policy for modelgen.test.ts: pinned metadata (high churn, high signal) vs shape-only (low churn, low signal).",
						"Rename shared.test.ts to match its subject.",
					],
				},
				{
					id: "codex-provider",
					name: "OpenAI Codex provider",
					layer: "unit",
					goal: "The hand-written AI SDK V3 provider for the ChatGPT Codex backend — request shaping, prompt conversion, SSE stream decoding, error mapping, and registry integration.",
					src: ["src/providers/openai-codex/* (7 modules)", "src/llm/registry.ts"],
					files: [
						{
							path: "test/provider/openai.codex.test.ts",
							lines: 1353,
							tests: 57,
							kind: "unit",
							covers:
								"ProviderV3 conformance; auth resolution (env key, async resolver, account id from JWT, explicit accountId); request building (endpoint, headers, defaults, tool + tool-choice mapping, native grammar tools, deferred tools via additional_tools, provider options, cache keys, zstd compression, unsupported-option warnings, custom base URLs); prompt conversion (all message roles, signed reasoning replay, images incl. AI SDK V4 shape, composite tool-call ids, image tool results); doStream (V3 part sequence, SSE cancellation, reasoning summaries, tool calls, incomplete/length mapping, error + response.failed events, raw chunks, usage-limit APICallError); doGenerate aggregation; registry registration.",
							notes: [
								"By far the largest file — 1353 lines, 24% of all test code. It is really five files: provider construction, auth, request, prompt, stream.",
								"Splitting it along the existing top-level describes would let you review each in one sitting and would mirror the src/providers/openai-codex/ module layout.",
								"Coverage here is genuinely thorough; the risk is maintainability, not gaps.",
								"Note the shared-fixture setup at the top (~180 lines before the first describe) — a good candidate for extraction into test/utils/.",
							],
						},
						{
							path: "test/e2e/codex.e2e.test.ts",
							lines: 77,
							tests: 1,
							kind: "e2e",
							covers:
								"One live test: streaming a Luna grammar tool through standard aikit tool events against the real Codex backend.",
							notes: [
								"Single test; validates that the native custom-tool path survives a real round trip. High value, low cost.",
								"Only Codex e2e file that is not part of the cross-provider matrix — keep it here rather than in the E2E themes.",
							],
						},
					],
					improve: [
						"Split test/provider/openai.codex.test.ts into files mirroring src/providers/openai-codex/ (provider, auth, request, prompt, sse).",
						"Extract the fixture preamble into a shared helper so the split files don't duplicate it.",
						"Check codex-usage.ts and codex-error.ts are reached — they are asserted indirectly and would be easy to break silently.",
					],
				},
				{
					id: "codex-auth",
					name: "Codex OAuth & credential storage",
					layer: "unit",
					goal: "The device-free OAuth flow for ChatGPT Codex: PKCE authorization, JWT account extraction, on-disk credential storage layouts, refresh and expiry skew.",
					src: ["src/oauth/openai/codex.ts", "src/cli/oauth.ts (198) — untested"],
					files: [
						{
							path: "test/codex.test.ts",
							lines: 387,
							tests: 32,
							kind: "unit",
							covers:
								"parseOpenAICodexAuthorizationInput (redirect URL, code#state, raw query, bare code, blank); getOpenAICodexAccountId (JWT claim, missing/empty/malformed); createOpenAICodexAuthorizationFlow (PKCE URL, custom redirect/scope/originator, uniqueness); JsonOpenAICodexAuthStorage (default path, CODEWORK_CREDENTIALS / CODEWORK_HOME_DIR, nested vs flat file layouts, key preservation, scoped clear, custom provider id); openAICodexHeaders; OpenAICodexOAuthClient (fresh credentials, callback server shutdown, refresh within skew, refresh failure, headers from refreshed credentials).",
							notes: [
								"Filename is the weakest signal in the suite — codex.test.ts sits next to test/provider/openai.codex.test.ts and test/e2e/codex.e2e.test.ts and tests something different from both. Rename to oauth.codex.test.ts or auth.test.ts.",
								"Storage round-tripping is covered well, including the legacy flat-file shape.",
								"Security-adjacent surface: check there is a case asserting credentials are never written world-readable, and that refresh tokens are not logged in error paths.",
								"'closes the callback server before login resolves' is the kind of test that catches real hangs — keep it.",
							],
						},
					],
					improve: [
						"Rename the file so its subject is unambiguous against the two other codex test files.",
						"src/cli/oauth.ts (198 lines) is untested — decide if the CLI wiring warrants coverage or is acceptable as glue.",
						"Add file-permission and secret-redaction assertions if they are not already implied.",
					],
				},
				{
					id: "events",
					name: "Event stream & runtime plumbing",
					layer: "unit",
					goal: "The async delivery primitive that carries agent events to consumers, the event schema itself, and the small runtime helpers every provider path touches.",
					src: ["src/utils/eventstream.ts", "src/event/event.ts (273)", "src/llm/runtime.ts"],
					files: [
						{
							path: "test/eventstream.test.ts",
							lines: 127,
							tests: 10,
							kind: "unit",
							covers:
								"EventStream — queued-before-iteration ordering, delivery to a waiting consumer, auto-end on the completing event, result() resolution, ignoring post-completion pushes, end() releasing a consumer, end(result) without a completing event, draining after end(). AssistantMessageEventStream — result() from done and from error events.",
							notes: [

				lines.push("");

				for (const s of t.src) lines.push(`- ${REPO}/${s}`);
				lines.push("");
				lines.push("Observations from an earlier pass (weigh them, do not treat them as a mandate):");
				for (const f of t.files) for (const n of f.notes) lines.push(`- [${f.path}] ${n}`);

				lines.push("Improvement candidates:");
				for (const i of t.improve) lines.push(`- ${i}`);
				lines.push("");
				lines.push(

					const ta = document.createElement("textarea");
					ta.value = text;
					document.body.appendChild(ta);

					ta.remove();
					toast(what + " copied");

						const cls = "nav-item" + (t.id === current ? " active" : "") + (reviewed.has(t.id) ? " done" : "");
						html += `<button class="${cls}" data-id="${t.id}">
				<div class="nav-row"><span class="nav-name">${esc(t.name)}</span></div>
				<div class="nav-sub">${t.files.length} files · ${s.tests} tests · ${s.lines} ln</div>
			</button>`;
					}
				}
				html += `<div class="group-title">Cross-cutting</div>
		<button class="nav-item${current === "__gaps" ? " active" : ""}" data-id="__gaps">
			<div class="nav-row"><span class="nav-name">Coverage gaps</span></div>
			<div class="nav-sub">untested modules · provider matrix</div>
		</button>`;
				const nav = document.getElementById("nav");
				nav.innerHTML = html;
				for (const b of nav.querySelectorAll(".nav-item")) {
					b.addEventListener("click", () => {
						current = b.dataset.id;
						location.hash = current;
						render();
						window.scrollTo(0, 0);
					});
				}
			}

			function renderTheme(t) {
				const s = totals(t);
				const done = reviewed.has(t.id);
				let html = `<div class="headline">
		<div>
			<h1>${esc(t.name)}</h1>
			<div class="lede">${esc(t.goal)}</div>
		</div>
		<div class="actions">
			<label class="chk"><input type="checkbox" id="reviewed" ${done ? "checked" : ""}/> reviewed</label>
			<button class="btn primary" id="copy-prompt">Copy session prompt</button>
		</div>
	</div>`;

				html += `<h2>Source under test</h2><div class="srclist">${t.src.map((x) => `<span>${esc(x)}</span>`).join("")}</div>`;

				html += `<h2>Files · ${t.files.length} · ${s.tests} tests · ${s.lines} lines</h2>`;
				for (const f of t.files) {
					html += `<div class="card">
			<div class="card-head">
				<span class="badge ${f.kind}">${f.kind}</span>
				<span class="path">${esc(REPO)}/${esc(f.path)}</span>
				${f.flag === "gap" ? '<span class="badge gap">gap</span>' : ""}
				<span class="stats">${f.lines} ln${f.tests ? " · " + f.tests + " tests" : ""}</span>
			</div>
			<p class="covers">${esc(f.covers)}</p>
			<ul class="notes">${f.notes.map((n) => `<li>${esc(n)}</li>`).join("")}</ul>
		</div>`;
				}

				html += `<h2>Improvement candidates</h2><ul class="plain">${t.improve.map((i) => `<li>${esc(i)}</li>`).join("")}</ul>`;

				const needsE2E = t.files.some((f) => f.kind === "e2e");
				html += `<h2>Running this theme</h2>`;
				html += `<code class="cmd">cd ${REPO} &amp;&amp; pnpm test</code>`;
				if (needsE2E) {
					html += `<code class="cmd">cd ${REPO} &amp;&amp; pnpm test:e2e</code>
		<div class="callout warn"><p>Live suites call paid providers and are gated on <code>ANTHROPIC_API_KEY</code>, <code>OPENAI_API_KEY</code>, <code>OPENAI_CODEX_API_KEY</code>, <code>OPENROUTER_API_KEY</code>. A missing key silently skips its <code>describe</code> — a green run does not mean full coverage.</p></div>`;
				}
				return html;
			}

			function renderGaps() {
				let html = `<div class="headline"><div>
		<h1>Coverage gaps</h1>
		<div class="lede">What the 26 test files do not reach, and where the live matrix is uneven.</div>
	</div></div>`;

				html += `<div class="callout"><p><strong>src/llm/stream.ts — 534 lines, zero unit tests.</strong> The streaming orchestrator every provider path runs through is exercised only by live e2e suites. When provider keys are absent, the most important module in the package is completely untested.</p></div>`;

				html += `<h2>Modules without a dedicated test file</h2><div class="scroll"><table>
		<thead><tr><th>Module</th><th>Lines</th><th>Note</th></tr></thead><tbody>`;
				for (const m of GAPS.modules) {
					html += `<tr><td class="mono">${esc(m.path)}</td><td class="mono">${m.lines}</td><td>${esc(m.note)}</td></tr>`;
				}
				html += `</tbody></table></div>`;

				html += `<h2>Live provider matrix</h2><p class="lede" style="font-size:14px">Which e2e files exercise which provider.</p><div class="scroll"><table>
		<thead><tr><th>File</th>${GAPS.matrix.providers.map((p) => `<th>${esc(p)}</th>`).join("")}</tr></thead><tbody>`;
				for (const r of GAPS.matrix.rows) {
					html += `<tr><td class="mono">${esc(r.file)}</td>${r.cov.map((c) => `<td class="${c ? "yes" : "no"}">${c ? "✓" : "—"}</td>`).join("")}</tr>`;
				}
				html += `</tbody></table></div>`;

				html += `<h2>Structural observations</h2><ul class="plain">
		<li><strong>Three files named for Codex, three different subjects.</strong> <code>test/codex.test.ts</code> is OAuth, <code>test/provider/openai.codex.test.ts</code> is the provider, <code>test/e2e/codex.e2e.test.ts</code> is live. Renaming the first is the cheapest legibility win available.</li>
		<li><strong>One file holds 24% of all test code.</strong> <code>test/provider/openai.codex.test.ts</code> at 1353 lines should be five files mirroring <code>src/providers/openai-codex/</code>.</li>
		<li><strong>Every e2e file repeats the same per-provider block.</strong> Nested <code>describeIf*</code> wrappers with copy-pasted <code>it</code> bodies and inline retry/timeout literals. A single matrix runner in <code>test/utils/llm.ts</code> would shrink the e2e suite substantially and make provider gaps declarative instead of invisible.</li>
		<li><strong>Filenames carry the theme, mostly.</strong> The exceptions worth renaming: <code>codex.test.ts</code>, <code>shared.test.ts</code>, <code>message.transform.test.ts</code> vs <code>transform.test.ts</code>, and <code>event.tool.execution.test.ts</code> (name implies all events, covers two).</li>
	</ul>`;

				html += `<h2>Suggested order</h2><ul class="plain">
		<li><strong>1 · Test harness</strong> — the matrix runner and fixtures unlock everything downstream.</li>
		<li><strong>2 · E2E core + edge</strong> — apply the matrix runner, close the four provider gaps.</li>
		<li><strong>3 · Codex provider</strong> — split the 1353-line file.</li>
		<li><strong>4 · Events &amp; runtime</strong> — table-drive the event schema, and decide what a <code>stream.ts</code> unit test looks like.</li>
		<li><strong>5 · Everything else</strong> — smaller, healthier, mostly renames and added edge cases.</li>
	</ul>`;
				return html;
			}

			function render() {
				renderNav();
				renderProgress();
				const main = document.getElementById("main");
				if (current === "__gaps") {
					main.innerHTML = renderGaps();
					return;
				}
				const t = THEMES.find((x) => x.id === current) || THEMES[0];
				main.innerHTML = renderTheme(t);
				document
					.getElementById("copy-prompt")
					.addEventListener("click", () => copy(sessionPrompt(t), "Session prompt"));
				document.getElementById("reviewed").addEventListener("change", (e) => {
					if (e.target.checked) reviewed.add(t.id);
					else reviewed.delete(t.id);
					persist();
					renderNav();
					renderProgress();
				});
			}

			document.getElementById("search").addEventListener("input", (e) => {
				filter = e.target.value.trim().toLowerCase();
				renderNav();
			});
			window.addEventListener("hashchange", () => {
				const h = location.hash.slice(1);
				if (h && h !== current) {
					current = h;
					render();
				}
			});

			renderMeta();
			render();
		</script>
	</body>
</html>
